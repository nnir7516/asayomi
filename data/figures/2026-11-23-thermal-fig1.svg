<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340">
<rect x="0" y="0" width="400" height="340" fill="#ffffff" />
<text x="200" y="26" font-size="18" text-anchor="middle" font-weight="bold" fill="#222">レチクル加熱のしくみ（断面）</text>
<g stroke="#7b3fa0" stroke-width="3" fill="#7b3fa0">
<line x1="150" y1="44" x2="150" y2="96" /><polygon points="143,92 157,92 150,104" />
<line x1="200" y1="44" x2="200" y2="96" /><polygon points="193,92 207,92 200,104" />
<line x1="250" y1="44" x2="250" y2="96" /><polygon points="243,92 257,92 250,104" />
</g>
<text x="268" y="70" font-size="16" fill="#7b3fa0">露光光（DUV）</text>
<text x="12" y="96" font-size="16" fill="#1a6fb0">冷却流</text>
<line x1="14" y1="128" x2="50" y2="128" stroke="#1a6fb0" stroke-width="3" />
<polygon points="48,121 60,128 48,135" fill="#1a6fb0" />
<rect x="64" y="110" width="272" height="40" fill="#dcecf7" stroke="#333" stroke-width="2" />
<text x="200" y="136" font-size="16" text-anchor="middle" fill="#222">レチクル（石英）</text>
<rect x="44" y="150" width="40" height="18" fill="#666" />
<rect x="316" y="150" width="40" height="18" fill="#666" />
<text x="12" y="192" font-size="16" fill="#222">クランプ</text>
<rect x="100" y="150" width="200" height="8" fill="#c0392b" />
<text x="200" y="186" font-size="16" text-anchor="middle" fill="#c0392b">吸収層（クロム）が発熱</text>
<line x1="94" y1="158" x2="94" y2="232" stroke="#333" stroke-width="2" />
<line x1="306" y1="158" x2="306" y2="232" stroke="#333" stroke-width="2" />
<line x1="94" y1="232" x2="306" y2="232" stroke="#2e8b57" stroke-width="3" />
<text x="200" y="212" font-size="16" text-anchor="middle" fill="#2e8b57">ペリクル（保護膜）</text>
<text x="200" y="262" font-size="16" text-anchor="middle" fill="#222">下面はペリクルで覆われ放熱しにくい</text>
<text x="200" y="290" font-size="16" text-anchor="middle" fill="#222">熱は吸収層から上面へ伝わり、</text>
<text x="200" y="314" font-size="16" text-anchor="middle" fill="#222">上面の対流と冷却流で逃げる</text>
