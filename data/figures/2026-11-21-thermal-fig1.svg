<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330"> <rect width="400" height="330" fill="#ffffff" /> <text x="100" y="24" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">3次元（断面）</text> <text x="300" y="24" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">VTLM（2層）</text> <rect x="20" y="40" width="160" height="10" fill="#9a6b3c" /> <rect x="20" y="50" width="25" height="110" fill="#c98d4f" /> <rect x="45" y="50" width="45" height="110" fill="#bfe0f5" /> <rect x="90" y="50" width="25" height="110" fill="#c98d4f" /> <rect x="115" y="50" width="45" height="110" fill="#bfe0f5" /> <rect x="160" y="50" width="20" height="110" fill="#c98d4f" /> <rect x="20" y="160" width="160" height="40" fill="#9a6b3c" /> <text x="67" y="112" font-size="16" text-anchor="middle" fill="#1b4f72">水</text> <text x="137" y="112" font-size="16" text-anchor="middle" fill="#1b4f72">水</text> <text x="100" y="186" font-size="16" text-anchor="middle" fill="#fff">ベース板（銅）</text> <line x1="20" y1="214" x2="180" y2="214" stroke="#c0392b" stroke-width="3" /> <text x="100" y="236" font-size="16" text-anchor="middle" fill="#c0392b">底面から加熱</text> <text x="10" y="270" font-size="16" fill="#333">高さ H を変えて</text> <text x="10" y="292" font-size="16" fill="#333">AR=H/W：0.2〜5.0</text> <path d="M188 120 L210 120" stroke="#555" stroke-width="2" /> <path d="M210 114 L220 120 L210 126 Z" fill="#555" /> <rect x="228" y="60" width="150" height="62" fill="#e8f4fb" stroke="#2e86c1" stroke-width="2" /> <text x="303" y="86" font-size="16" text-anchor="middle" fill="#1b4f72">Layer 1</text> <text x="303" y="108" font-size="16" text-anchor="middle" fill="#1b4f72">水とフィンの平面</text> <rect x="228" y="150" width="150" height="62" fill="#f3e3d3" stroke="#9a6b3c" stroke-width="2" /> <text x="303" y="176" font-size="16" text-anchor="middle" fill="#6e4b2a">Layer 2</text> <text x="303" y="198" font-size="16" text-anchor="middle" fill="#6e4b2a">根元とベース板</text> <path d="M303 124 L303 148" strok