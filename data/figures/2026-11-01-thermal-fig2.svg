<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#fff" /><text x="320" y="26" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">提案手法（CTO）の変化率（論文記載の値）</text><line x1="380" y1="45" x2="380" y2="305" stroke="#555" /><text x="10" y="77" font-size="14" fill="#222">層流: 平均温度上昇</text><rect x="270.0" y="55" width="110.0" height="30" fill="#2a8a5a" /><text x="264.0" y="76" font-size="14" fill="#222" text-anchor="end">-20%（対 FGTO）</text><text x="10" y="127" font-size="14" fill="#222">層流: Nu数</text><rect x="380" y="105" width="82.5" height="30" fill="#2a6ea8" /><text x="468.5" y="126" font-size="14" fill="#222" text-anchor="start">+15%（対 FGTO）</text><text x="10" y="177" font-size="14" fill="#222">乱流: 最大温度上昇</text><rect x="323.9" y="155" width="56.099999999999994" height="30" fill="#2a8a5a" /><text x="317.9" y="176" font-size="14" fill="#222" text-anchor="end">-10.2%（対 FGTO）</text><text x="10" y="227" font-size="14" fill="#222">乱流: 圧力損失（最大）</text><rect x="242.5" y="205" width="137.5" height="30" fill="#2a8a5a" /><text x="236.5" y="226" font-size="14" fill="#222" text-anchor="end">-25%（対 FGTO）</text><text x="10" y="277" font-size="14" fill="#222">乱流: 平均温度上昇</text><rect x="226.0" y="255" width="154.0" height="30" fill="#2a8a5a" /><text x="220.0" y="276" font-size="14" fill="#222" text-anchor="end">-28%（対ピンフィン）</text><text x="320" y="330" font-size="13" text-anchor="middle" fill="#555">温度上昇・圧力損失は負が改善、Nu数は正が改善。FGTO＝電場シナジーなしの従来TO</text></svg>
