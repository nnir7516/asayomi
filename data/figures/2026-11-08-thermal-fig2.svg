<text x="295" y="264" font-size="16" text-anchor="middle" fill="#222">パッド（0.11MPa）</text>
<text x="200" y="288" font-size="14" text-anchor="middle" fill="#555">縦軸：熱伝導率 k [W/(m·K)]</text>
