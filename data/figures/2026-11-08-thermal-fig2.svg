<line x1="20" y1="240" x2="380" y2="240" stroke="#222" stroke-width="2" />
<rect x="40" y="130" width="60" height="110" fill="#5b8fc7" /><text x="70" y="124" font-size="16" text-anchor="middle" fill="#222">3.0</text>
<rect x="110" y="94" width="60" height="146" fill="#e08a3c" /><text x="140" y="88" font-size="16" text-anchor="middle" fill="#222">4.2</text>
<rect x="230" y="198" width="60" height="42" fill="#5b8fc7" /><text x="260" y="192" font-size="16" text-anchor="middle" fill="#222">1.1</text>
<rect x="300" y="184" width="60" height="56" fill="#e08a3c" /><text x="330" y="178" font-size="16" text-anchor="middle" fill="#222">1.5</text>
