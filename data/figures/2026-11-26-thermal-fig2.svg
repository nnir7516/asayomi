<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif"><rect width="400" height="330" fill="#ffffff" /><defs><marker id="a2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c0392b" /></marker></defs><text x="200" y="24" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">波形フィンの熱抵抗の内訳</text><rect x="50" y="36" width="300" height="34" rx="4" fill="#fdecea" stroke="#c0392b" /><text x="200" y="59" font-size="16" text-anchor="middle" fill="#1a1a1a">加熱面（チップ側）</text><line x1="200" y1="70" x2="200" y2="88" stroke="#c0392b" stroke-width="3" marker-end="url(#a2)" /><rect x="50" y="92" width="300" height="56" rx="4" fill="#f4f4f4" stroke="#555" /><text x="200" y="115" font-size="16" text-anchor="middle" fill="#1a1a1a">ベース板（厚さ5 mm）の熱伝導</text><text x="200" y="138" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">全体の56〜63%</text><line x1="200" y1="148" x2="200" y2="166" stroke="#c0392b" stroke-width="3" marker-end="url(#a2)" /><rect x="40" y="170" width="320" height="96" rx="4" fill="#fbf6ee" stroke="#b5651d" /><text x="200" y="190" font-size="16" text-anchor="middle" fill="#1a1a1a">フィン部（%はフィン部の中の割合）</text><rect x="50" y="200" width="145" height="58" rx="4" fill="#ffffff" stroke="#b5651d" /><text x="122" y="223" font-size="16" text-anchor="middle" fill="#1a1a1a">フィン内の</text><text x="122" y="246" font-size="16" text-anchor="middle" fill="#1a1a1a">熱伝導72〜83%</text><rect x="205" y="200" width="145" height="58" rx="4" fill="#ffffff" stroke="#1f6fb5" /><text x="277" y="223" font-size="16" text-anchor="middle" fill="#1a1a1a">表面→水の</text><text x="277" y="246" font-size="16" text-anchor="middle" fill="#1a1a1a">対流17〜28%</text><line x1="200" y1="266" x2="200" y2="284" stroke="#c0392b" stroke-width="3" marker-end="url(#a2)" /><rect x="50" y="288" width="300" height="34" rx="4" fill="#e8f1fa" stroke="#1f6fb5" /><text x="200" y="311" font-s