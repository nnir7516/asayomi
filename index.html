<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>朝読みログ</title>
<meta name="description" content="毎朝のAIニュースと熱流体リサーチを読み、興味と理解度を記録するアプリ">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-in">
      <a class="brand" href="#home">朝読みログ</a>
      <span class="updated" id="updated" aria-live="polite"></span>
      <button type="button" class="iconbtn" id="refresh" aria-label="最新の記事を読み込む" title="最新の記事を読み込む">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <div class="empty"><h2>読み込み中</h2><p>記事の一覧を取得しています。</p></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <nav class="tabbar" aria-label="メイン">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>記事</span>
    </a>
    <a href="#trends" data-tab="trends">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>傾向</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>通知と設定</span>
    </a>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
