name: notify

on:
  push:
    branches: [main]
    paths: ["data/index.json", "push/subscriptions.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node scripts/notify.mjs
        env:
          PUSH_SEED: ${{ secrets.PUSH_SEED }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          BEFORE_SHA: ${{ github.event.before }}
